<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="100%" height="100%">
      
    <defs>
      <pattern id="linenGrid" width="6" height="6" patternUnits="userSpaceOnUse">
        <path d="M 0 3 L 6 3 M 3 0 L 3 6" stroke="#E8DFC8" stroke-width="0.3" opacity="0.12"/>
      </pattern>
      <pattern id="ginghamPlaid" width="16" height="16" patternUnits="userSpaceOnUse">
        <rect width="8" height="8" fill="#E8DFC8" opacity="0.25"/>
        <rect x="8" y="8" width="8" height="8" fill="#E8DFC8" opacity="0.25"/>
      </pattern>
      <pattern id="polkaDots" width="14" height="14" patternUnits="userSpaceOnUse">
        <circle cx="7" cy="7" r="1.6" fill="#E8DFC8" opacity="0.6"/>
      </pattern>
      <pattern id="ditsyFlowers" width="20" height="20" patternUnits="userSpaceOnUse">
        <circle cx="10" cy="10" r="1.5" fill="#E8DFC8" opacity="0.7"/>
        <circle cx="7" cy="9" r="1.2" fill="#E8B49B" opacity="0.8"/>
        <circle cx="13" cy="9" r="1.2" fill="#E8B49B" opacity="0.8"/>
        <circle cx="8.5" cy="12" r="1.2" fill="#E8B49B" opacity="0.8"/>
        <circle cx="11.5" cy="12" r="1.2" fill="#E8B49B" opacity="0.8"/>
      </pattern>
      <linearGradient id="softShadow" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="black" stop-opacity="0.03"/>
        <stop offset="100%" stop-color="black" stop-opacity="0.08"/>
      </linearGradient>
    </defs>
    
      <!-- Canvas Card Surface -->
      <rect width="300" height="400" fill="#F5EFEB"/>
      <rect x="12" y="12" width="276" height="376" rx="12" fill="none" stroke="#E8DFC8" stroke-width="0.8" opacity="0.25"/>
      <rect x="16" y="16" width="268" height="368" rx="8" fill="none" stroke="#E8DFC8" stroke-width="0.4" stroke-dasharray="3 3" opacity="0.3"/>

      <!-- Top VERA Monogram Stamp -->
      <g transform="translate(150, 48)">
        <circle cx="0" cy="0" r="16" fill="#E8DFC8" opacity="0.08"/>
        <text x="0" y="5" font-family="'Playfair Display', serif" font-style="italic" font-size="14" font-weight="600" fill="#E8DFC8" text-anchor="middle">V</text>
        <text x="0" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="700" letter-spacing="2" fill="#E8DFC8" text-anchor="middle" opacity="0.8">VERA VINTAGE</text>
      </g>

      <!-- Main Garment Silhouette -->
      
        <g filter="drop-shadow(0px 8px 16px rgba(60,35,20,0.06))">
          <!-- Blazer Body -->
          <path d="M 95 130 C 120 120 180 120 205 130 L 195 240 L 105 240 Z" fill="#633B26" stroke="#E8DFC8" stroke-width="1.5"/>
          <!-- Sleeves -->
          <path d="M 95 130 L 72 230 L 95 235 L 105 150 Z" fill="#633B26" stroke="#E8DFC8" stroke-width="1.2"/>
          <path d="M 205 130 L 228 230 L 205 235 L 195 150 Z" fill="#633B26" stroke="#E8DFC8" stroke-width="1.2"/>
          <!-- Lapels -->
          <path d="M 115 125 L 145 190 L 155 190 L 185 125 L 160 122 L 140 122 Z" fill="#E8DFC8" opacity="0.15" stroke="#E8DFC8" stroke-width="1.2"/>
          <circle cx="150" cy="205" r="3.5" fill="#E8DFC8"/>
          <circle cx="150" cy="225" r="3.5" fill="#E8DFC8"/>
          <!-- Matching Mini Skirt / Trouser -->
          <path d="M 110 245 L 190 245 L 205 320 C 150 330 150 330 95 320 Z" fill="#633B26" stroke="#E8DFC8" stroke-width="1.5"/>
        </g>
        

      <!-- Bottom Card Metadata Tag -->
      <g transform="translate(150, 368)">
        <rect x="-85" y="-14" width="170" height="20" rx="4" fill="white" stroke="#E8DFC8" stroke-width="0.8" opacity="0.95"/>
        <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#E8DFC8" text-anchor="middle">
          100% Linen · Thiết Kế Độc Quyền
        </text>
      </g>
    </svg>
    